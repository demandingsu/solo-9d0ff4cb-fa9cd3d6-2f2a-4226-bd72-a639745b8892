services:
  fund-penetration:
    build: .
    image: fund-penetration:latest
    container_name: fund-penetration
    ports:
      - "8000:8000"
    environment:
      FUND_DB_PATH: /data/fund_holdings.db
    volumes:
      - fund_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  fund_data:
